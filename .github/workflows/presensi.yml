name: ETHOL Presensi Bot

on:
  schedule:
    # Setiap 5 menit, Senin-Jumat jam 06:00-21:00 WIB (UTC+7 = UTC-7 jam)
    # GitHub Actions cron dalam UTC: WIB 06:00 = UTC 23:00 (hari sebelumnya)
    # WIB 21:00 = UTC 14:00
    - cron: "*/5 23-23 * * 0,1,2,3,4"   # WIB 06:00 (UTC 23:xx hari sebelumnya)
    - cron: "*/5 0-13 * * 1,2,3,4,5"    # WIB 07:00-20:xx (UTC 00:xx-13:xx)
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 14 * * 1,2,3,4,5"  # WIB 21:00 (UTC 14:xx)
  workflow_dispatch:  # Bisa dijalankan manual dari GitHub

jobs:
  presensi:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pytz

      - name: Run ETHOL Bot
        env:
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          JAM_MULAI: "6"
          JAM_SELESAI: "21"
        run: |
          python app_actions.py 2>&1 | tee bot_log.txt

      - name: Upload Log File (.txt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-run-log
          path: bot_log.txt
          retention-days: 7
